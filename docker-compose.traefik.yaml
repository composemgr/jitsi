name: jitsi
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

x-env: &default-env
  TZ: ${TZ:-America/New_York}
  HTTP_PORT: '80'
  HTTPS_PORT: '443'
  PUBLIC_URL: http://${BASE_HOST_NAME:-$HOSTNAME}
  JICOFO_MAX_MEMORY: 3072m
  VIDEOBRIDGE_MAX_MEMORY: 3072m
  ENABLE_JAAS_COMPONENTS: '0'
  ENABLE_LETSENCRYPT: '0'
  ETHERPAD_URL_BASE: http://etherpad.meet.jitsi:9001
  ETHERPAD_PUBLIC_URL: https://etherpad.${BASE_DOMAIN_NAME:-example.com}/p/
  WHITEBOARD_COLLAB_SERVER_URL_BASE: http://whiteboard.meet.jitsi
  WHITEBOARD_COLLAB_SERVER_PUBLIC_URL: https://whiteboard.${BASE_DOMAIN_NAME:-example.com}
  JIGASI_SIP_URI: test@sip2sip.info
  JIGASI_SIP_PASSWORD: ${APP_SECRET_KEY:-changeme_sip_password}
  JIGASI_SIP_SERVER: sip2sip.info
  JIGASI_SIP_PORT: '5060'
  JIGASI_SIP_TRANSPORT: UDP
  ENABLE_AUTH: '1'
  ENABLE_GUESTS: '1'
  AUTH_TYPE: internal
  JWT_APP_ID: ${APP_API_TOKEN:-replace-with-a-random-app-id}
  JWT_APP_SECRET: ${APP_SECRET_KEY:-replace-with-a-random-secret-key}
  JWT_ACCEPTED_ISSUERS: my_web_client,my_app_client
  JWT_ACCEPTED_AUDIENCES: my_server1,my_server2
  JICOFO_AUTH_PASSWORD: ${APP_SECRET_KEY:-changeme_jicofo_password}
  JVB_AUTH_PASSWORD: ${APP_SECRET_KEY:-changeme_jvb_password}
  JIGASI_XMPP_PASSWORD: ${APP_SECRET_KEY:-changeme_jigasi_xmpp_password}
  JIGASI_TRANSCRIBER_PASSWORD: ${APP_SECRET_KEY:-changeme_transcriber_password}
  JIBRI_RECORDER_PASSWORD: ${APP_SECRET_KEY:-changeme_jibri_recorder_password}
  JIBRI_XMPP_PASSWORD: ${APP_SECRET_KEY:-changeme_jibri_xmpp_password}

services:
  web:
    image: ghcr.io/jitsi/web:unstable
    container_name: jitsi-web
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      <<: *default-env
      CONTAINER_NAME: jitsi-web
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/jitsi:/config:Z'
      - './volumes/config/jitsi/cron:/var/spool/cron/crontabs:Z'
      - './volumes/config/jitsi/load-test:/usr/share/jitsi-meet/load-test:Z'
      - './volumes/data/jitsi/transcripts:/usr/share/jitsi-meet/transcripts:Z'
    depends_on:
      - jvb
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.web.entrypoints=http'
      - 'traefik.http.routers.web.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.web.middlewares=web-https-redirect'
      - 'traefik.http.middlewares.web-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.web-secure.entrypoints=https'
      - 'traefik.http.routers.web-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.web-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.web-secure.service=web'
      - 'traefik.http.services.web.loadbalancer.server.port=80'
    networks:
      - jitsi
      - traefik
  prosody:
    image: ghcr.io/jitsi/prosody:unstable
    container_name: jitsi-prosody
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: jitsi-prosody
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      <<: *default-env
      CONTAINER_NAME: jitsi-prosody
    expose:
      - '5222'
      - '5269'
      - '5347'
      - '5280'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:5222/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/prosody:/config:Z'
      - './volumes/data/prosody:/prosody-plugins-custom:Z'
    networks:
      - jitsi

  jicofo:
    image: ghcr.io/jitsi/jicofo:unstable
    container_name: jitsi-jicofo
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: jitsi-jicofo
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      <<: *default-env
      CONTAINER_NAME: jitsi-jicofo
    expose:
      - '8888'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8888/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/jicofo:/config:Z'
    depends_on:
      - prosody
    networks:
      - jitsi

  jvb:
    image: ghcr.io/jitsi/jvb:unstable
    container_name: jitsi-jvb
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: jitsi-jvb
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      <<: *default-env
      CONTAINER_NAME: jitsi-jvb
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/jvb:/config:Z'
    depends_on:
      - prosody
    networks:
      - jitsi

networks:
  jitsi:
    name: jitsi
    external: false
  traefik:
    external: true
